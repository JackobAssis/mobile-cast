name: CI - Mobile Cast

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install server deps
        run: npm ci
        working-directory: server
      - name: Typecheck + build server
        run: |
          npm run typecheck
          npm run build
        working-directory: server
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Typecheck + build web
        run: |
          npm run typecheck
          npm run build
        working-directory: web
      - name: Start server + run signaling E2E
        run: |
          PORT=3099 timeout 30 node server/dist/index.js &
          SERVER_PID=$!
          sleep 3
          curl -s http://localhost:3099/api/health | grep -q '"status":"ok"'
          curl -s http://localhost:3099/api/config | grep -q '"wsUrl"'
          npm --prefix tests ws 2>/dev/null || npm i --prefix tests ws --silent || true
          PORT=3099 node tests/signaling.test.mjs
          kill $SERVER_PID || true
          wait $SERVER_PID || true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f Dockerfile -t mobile-cast:ci .
