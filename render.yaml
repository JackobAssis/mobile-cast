services:
  - type: web
    name: mobile-cast
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Render injeta PORT=10000 — Dockerfile agora respeita $PORT via HEALTHCHECK
    # Free tier: 512MB, sleep após 15min idle (cold start 30-50s)
    # Para testes, crie um cron que pinga /api/health a cada 10min para manter acordado
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_MS
        value: 7200000
      # CORS: se precisar restringir
      # - key: CORS_ORIGIN
      #   value: https://mobile-cast.onrender.com
