# coturn config para Mobile Cast — Fase 7 (self-hosted)
# Uso: docker run -p 3478:3478 -p 5349:5349 coturn/coturn -c /etc/coturn/turnserver.conf
# Ou compose: ver docker-compose.coturn.yml

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=SEU_IP_PUBLICO
realm=mobile-cast
server-name=mobile-cast

# Auth — troque em produção
user=mobilecast:troque-senha-forte
lt-cred-mech

# Segurança
no-stdout-log
log-file=/var/log/turn.log
verbose

# Rede
min-port=49152
max-port=65535
# Se atrás de NAT, descomente:
# external-ip=SEU_IP_PUBLICO/SEU_IP_PRIVADO

# TLS (opcional, precisa cert)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem

# Limites
total-quota=100
bps-capacity=0
stale-nonce=600
